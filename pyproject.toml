[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-mcp"
version = "0.3.0"
description = "Local MCP task delegation through official model APIs"
license = {file = "LICENSE"}

requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.27,<1", "pydantic>=2.8,<3", "keyring>=25,<26", "pypdf>=6,<7"]

[project.urls]
Repository = "https://github.com/qhchen31/agent_mcp_gateway"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[project.scripts]
agent-mcp = "agent_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["agent_mcp*"]

[tool.setuptools.package-data]
agent_mcp = ["config.example.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
